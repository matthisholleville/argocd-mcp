name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Vet
        run: go vet ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: E2E (k3s + ArgoCD)
        run: make e2e

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add Helm repositories
        run: helm repo add ollama-helm https://otwld.github.io/ollama-helm/

      - name: Build chart dependencies
        run: helm dependency build charts/argocd-mcp

      - name: Lint chart
        run: helm lint charts/argocd-mcp --set argocd.baseURL=https://argocd.example.com --set argocd.token=test

      - name: Lint chart with embeddings (ollama subchart)
        run: helm lint charts/argocd-mcp --set argocd.baseURL=https://argocd.example.com --set argocd.token=test --set embeddings.enabled=true

  helm-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add Helm repositories
        run: helm repo add ollama-helm https://otwld.github.io/ollama-helm/

      - name: Render chart diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ./hack/helm-diff.sh "origin/$BASE_REF" > helm.diff
          if [ -s helm.diff ]; then
            {
              echo "### Helm diff: rendered manifests vs \`$BASE_REF\`"
              echo
              echo "Profiles: \`default\` and \`embeddings\` (\`embeddings.enabled=true\`, renders the ollama subchart)."
              echo
              echo '```diff'
              head -c 60000 helm.diff
              echo '```'
              if [ "$(wc -c < helm.diff)" -gt 60000 ]; then echo "_Diff truncated, run \`./hack/helm-diff.sh origin/$BASE_REF\` locally for the full output._"; fi
            } > comment.md
            cat comment.md >> "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment diff on PR
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: helm-diff
          path: comment.md

      - name: Remove diff comment when chart is unchanged
        if: steps.diff.outputs.changed != 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: helm-diff
          delete: true

  helm-push-dev:
    runs-on: ubuntu-latest
    needs: [build, lint, helm-lint, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: helm-push
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Add Helm repositories
        run: helm repo add ollama-helm https://otwld.github.io/ollama-helm/

      - name: Build chart dependencies
        run: helm dependency build charts/argocd-mcp

      - name: Package dev chart
        run: |
          SHA="${{ github.sha }}"
          sed -i "s/^version:.*/version: 0.0.0-dev-${SHA::8}/" charts/argocd-mcp/Chart.yaml
          helm package charts/argocd-mcp

      - name: Push dev chart to GHCR
        run: |
          SHA="${{ github.sha }}"
          helm push argocd-mcp-0.0.0-dev-${SHA::8}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  docker:
    runs-on: ubuntu-latest
    needs: [build, lint, helm-lint, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            VERSION=dev-${{ github.sha }}
